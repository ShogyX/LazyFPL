[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-engine"
version = "0.1.0"
description = "FPL Intelligence Engine — self-hosted FPL prediction & optimisation service"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2,<3",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "python-dotenv>=1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pandas>=2",
    "pulp>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
study = ["lightgbm>=4"]  # optional GBM + SHAP enhancement

[project.scripts]
fpl = "fpl_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so cross-test imports like
# `from tests.test_panel import _pipeline` resolve under a bare `pytest`
# invocation (CI), not just `python -m pytest`.
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
